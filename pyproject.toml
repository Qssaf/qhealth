[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qhealth"
dynamic = ["version"]
description = "Offline screen time, app usage and input activity tracker for Linux (KDE Plasma) and Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qssaf" }]
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6"]
keywords = ["screen time", "digital wellbeing", "activity tracker", "kde", "plasma", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Qssaf/qhealth"
Issues = "https://github.com/Qssaf/qhealth/issues"

[project.scripts]
qhealth = "qhealth_core.cli:main"

[tool.setuptools.packages.find]
include = ["qhealth_core*", "qhealth_gui*"]

[tool.setuptools.package-data]
"qhealth_gui.assets.ui" = ["*.svg"]

[tool.setuptools.dynamic]
version = { attr = "qhealth_core.__version__" }
