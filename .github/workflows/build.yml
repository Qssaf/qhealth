name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # tag builds publish a GitHub release

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install "PyQt6>=6.6" build
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_suite.py -v
      - name: Python package
        run: python -m build
      - name: Installer dry run
        run: |
          HOME="$RUNNER_TEMP/home" ./install.sh
          "$RUNNER_TEMP/home/.local/bin/qhealth" --version
          HOME="$RUNNER_TEMP/home" ./install.sh --uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: qhealth-python
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "PyQt6>=6.6" pyinstaller
      - name: Tests (incl. Windows backend)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_suite.py -v
      - name: Build QHealth.exe
        run: |
          python packaging/windows/make_icon.py
          pyinstaller packaging/windows/qhealth.spec --noconfirm
      - name: Smoke-test the build
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA "QHealth"
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue  # the test run above created one
          $v = Start-Process dist\QHealth\QHealth.exe -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited with $($v.ExitCode)" }
          # Run the real tray app for a few seconds: imports, Qt plugins, DB and the embedded tracker must come up
          $app = Start-Process dist\QHealth\QHealth.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "QHealth.exe exited early with $($app.ExitCode)" }
          if (-not (Test-Path (Join-Path $data "qhealth.db"))) { throw "database was not created" }
          if (-not (Test-Path (Join-Path $data "live_state.json"))) { throw "tracker did not publish live state" }
          Get-Content (Join-Path $data "live_state.json")
          Stop-Process -Id $app.Id -Force
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import qhealth_core; print(qhealth_core.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\qhealth.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Test silent install / uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\QHealth-*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\QHealth\QHealth.exe"
          if (-not (Test-Path $exe)) { throw "installer did not place QHealth.exe at $exe" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name QHealth -ErrorAction SilentlyContinue
          if (-not $run) { throw "autostart entry missing" }
          $uninstaller = Join-Path $env:LOCALAPPDATA "Programs\QHealth\unins000.exe"
          Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstaller left QHealth.exe behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: qhealth-windows
          path: dist/QHealth-*-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/QHealth-*-Setup.exe --generate-notes
